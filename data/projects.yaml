# Projects page data — rendered by layouts/projects/single.html
#
# Sections:
#   work  — where I'm currently employed (dossier cards)
#   side  — side projects (dossier cards)
#   past  — past employers + past work (plain lists)
#
# Fields (work / side):
#   name     required
#   logo     optional. Path under /static, e.g. images/projects/foo.png
#            When missing, the template renders a monogram tile from the name.
#   status   active | building | shipped | dormant | archived
#   role     optional. Shown under the name — use it for employment.
#   summary  required. 1-3 sentences. Used by the "dossier" style.
#   tagline  short one-liner. Used by the "ledger" style; falls back to summary.
#   links    optional list of { text, url }.
#
# Fields (past employers / works items):
#   name, logo, role (employers only), note, url — all optional except name.
#   Leave url out when the page is gone; don't link to a 404.

work:
  - name: Routescan
    tagline: Multi-chain block explorer
    logo: images/projects/routescan.png
    role: Senior Platform Engineer
    summary: >-
      Block explorer and data platform covering Avalanche and a long tail of EVM
      chains. I work across the backend and the ingestion pipelines that keep
      hundreds of chains indexed and queryable.
    links:
      - text: routescan.io
        url: https://routescan.io/

side:
  - name: CO2 Snowboarding
    tagline: Ski club platform — courses and memberships
    logo: images/projects/co2snowboarding.png
    summary: >-
      The platform for the CO2 ski and snowboard club: signing kids up for
      courses, scheduling instructors, and the membership and association
      admin that comes with running the club. Built it end to end and keep it
      running each season.
    links:
      - text: co2snowboarding.it
        url: https://co2snowboarding.it/

  - name: Lines
    tagline: iOS app that turns gestures into artworks
    monogram: L
    summary: >-
      An iOS app built for the artist Giovanni Fredi. It records finger gestures
      as they scroll across a phone's photo library and keeps the traces. The
      resulting drawings became his solo show “Scrolling among pictures” at
      SMDOT/Contemporary Art in Udine.
    links:
      - text: Exhibition
        url: https://www.smdot.net/exhibitions/scrolling-among-pictures/
      - text: Mousse Magazine
        url: https://www.moussemagazine.it/magazine/giovanni-fredi-smdot-contemporary-art-udine-2022/

  - name: JAM
    tagline: iOS app that turns movement into music
    logo: images/projects/jam.png
    summary: >-
      An iOS app that turns how you move into music. Shake, tilt and gesture
      with the phone and it plays back the result as a beat, so the movement
      itself becomes the instrument.
    links:
      - text: App Store
        url: https://apps.apple.com/us/app/jam-shake-your-sound/id1270208998
      - text: jam.cool
        url: https://jam.cool/
      - text: Clockbeats
        url: https://blog.clockbeats.com/jam-lapp-che-trasforma-il-movimento-in-musica/
      - text: The Walkman
        url: https://www.thewalkman.it/jam-trasforma-liphone-strumento-musicale-intervista-paolo-mantini/
      - text: Andre1
        url: https://andre1blog.com/jam-e-la-nuova-app-musicale-e-gratuita-lanciata-da-paolo-mantini/

  - name: Panda
    tagline: macOS menu-bar light/dark switcher
    logo: images/projects/panda.png
    summary: >-
      A menu-bar app that flipped OS X Yosemite between light and dark themes,
      on a schedule if you wanted it to. Retired when macOS grew its own switch —
      which is the outcome you want from a utility this small.
    links:
      - text: GitHub
        url: https://github.com/pablosproject/Panda-Mac-app

